name: Release

# Manual release: POST /api/v1/repos/romaine-life/fzt-browser/actions/workflows/release.yml/dispatches
# with {"ref":"main"}. Build first, then publish the next v0.1.N and its assets.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      GOPRIVATE: github.com/romaine-life/*
      GOSUMDB: 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read organization modules from Forgejo
        env:
          TOKEN: ${{ secrets.PIPELINE_DISPATCH_TOKEN }}
        run: |
          if (-not $env:TOKEN) { throw 'PIPELINE_DISPATCH_TOKEN is not set' }
          $auth = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:TOKEN"))
          Write-Host "::add-mask::$auth"
          'GIT_CONFIG_COUNT=2',
          'GIT_CONFIG_KEY_0=url.https://forgejo.romaine.life/romaine-life/.insteadOf',
          'GIT_CONFIG_VALUE_0=https://github.com/romaine-life/',
          'GIT_CONFIG_KEY_1=http.https://forgejo.romaine.life/.extraheader',
          "GIT_CONFIG_VALUE_1=Authorization: Basic $auth" | Add-Content $env:GITHUB_ENV

      - name: Choose release version
        id: version
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $sha = git rev-parse HEAD
          $tag = git tag --points-at HEAD -l 'v0.1.*' --sort=-v:refname | Select-Object -First 1
          if (-not $tag) {
            $last = git tag -l 'v0.1.*' --sort=-v:refname | Select-Object -First 1
            $tag = if ($last) { 'v0.1.' + ([int]$last.Split('.')[2] + 1) } else { 'v0.1.0' }
          }
          $api = "$env:GITHUB_SERVER_URL/api/v1/repos/$env:GITHUB_REPOSITORY"
          $release = Invoke-RestMethod "$api/releases/tags/$tag" -Headers @{Authorization="token $env:TOKEN"} -SkipHttpErrorCheck -StatusCodeVariable code
          if ($code -notin 200,404) { throw "Release lookup returned $code" }
          $expected = 'fzt.wasm','fzt-terminal.js','fzt-terminal.css','fzt-web.js','fzt-dom-renderer.js'
          $complete = $code -eq 200 -and -not $release.draft -and @($expected | Where-Object { $_ -notin $release.assets.name }).Count -eq 0
          "tag=$tag", "sha=$sha", "skip=$($complete.ToString().ToLowerInvariant())" | Add-Content $env:GITHUB_OUTPUT
          Write-Host "Release $tag at $sha (already complete: $complete)"

      - uses: actions/setup-go@v5
        if: steps.version.outputs.skip != 'true'
        with:
          go-version-file: go.mod

      - name: Vet and build WASM
        if: steps.version.outputs.skip != 'true'
        env:
          GOOS: js
          GOARCH: wasm
          CGO_ENABLED: '0'
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $engine = go list -m -f '{{.Version}}' github.com/romaine-life/fzt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go vet .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go build -trimpath -ldflags "-X github.com/romaine-life/fzt/render.Version=$env:TAG -X github.com/romaine-life/fzt-frontend.EngineVersion=$engine" -o fzt.wasm .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($file in 'fzt.wasm','fzt-terminal.js','fzt-terminal.css','fzt-web.js','fzt-dom-renderer.js') {
            if ((Get-Item $file).Length -eq 0) { throw "Empty release asset: $file" }
          }

      - name: Publish release and five assets
        if: steps.version.outputs.skip != 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          $api = "$env:GITHUB_SERVER_URL/api/v1/repos/$env:GITHUB_REPOSITORY"
          $h = @{Authorization="token $env:TOKEN"}
          $tag = Invoke-RestMethod "$api/tags/$env:TAG" -Headers $h -SkipHttpErrorCheck -StatusCodeVariable code
          if ($code -eq 404) {
            Invoke-RestMethod -Method Post "$api/tags" -Headers $h -ContentType application/json -Body (@{tag_name=$env:TAG;target=$env:SHA} | ConvertTo-Json) | Out-Null
          } elseif ($code -ne 200 -or $tag.commit.sha -ne $env:SHA) { throw 'Release tag points to another commit' }
          $release = Invoke-RestMethod "$api/releases/tags/$env:TAG" -Headers $h -SkipHttpErrorCheck -StatusCodeVariable code
          if ($code -eq 404) {
            $body = @{tag_name=$env:TAG;target_commitish=$env:SHA;name=$env:TAG;body="Browser WASM release. $(git log --oneline -1)";draft=$true} | ConvertTo-Json
            $release = Invoke-RestMethod -Method Post "$api/releases" -Headers $h -ContentType application/json -Body $body
          } elseif ($code -ne 200) { throw "Release lookup returned $code" }
          foreach ($file in 'fzt.wasm','fzt-terminal.js','fzt-terminal.css','fzt-web.js','fzt-dom-renderer.js') {
            $existing = $release.assets | Where-Object name -eq $file
            if ($existing) {
              $saved = Join-Path $env:RUNNER_TEMP ([Guid]::NewGuid().ToString())
              try {
                Invoke-WebRequest $existing.browser_download_url -Headers $h -OutFile $saved
                if ((Get-FileHash $saved).Hash -ne (Get-FileHash $file).Hash) { throw "Existing asset differs: $file" }
              } finally { Remove-Item $saved -ErrorAction SilentlyContinue }
            } else {
              Invoke-RestMethod -Method Post "$api/releases/$($release.id)/assets?name=$file" -Headers $h -Form @{attachment=Get-Item $file} | Out-Null
            }
          }
          Invoke-RestMethod -Method Patch "$api/releases/$($release.id)" -Headers $h -ContentType application/json -Body '{"draft":false}' | Out-Null
          $published = Invoke-RestMethod "$api/releases/tags/$env:TAG" -Headers $h
          $tag = Invoke-RestMethod "$api/tags/$env:TAG" -Headers $h
          $expected = 'fzt.wasm','fzt-terminal.js','fzt-terminal.css','fzt-web.js','fzt-dom-renderer.js'
          if ($published.draft -or $tag.commit.sha -ne $env:SHA -or @($expected | Where-Object { $_ -notin $published.assets.name }).Count) { throw 'Release verification failed' }
          Write-Host "$($published.html_url) at $env:SHA with all five assets"
