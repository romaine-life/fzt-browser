name: CI

# Every PR and main commit builds the same five assets as a release; a PR that
# changes only documentation skips the build. A manual run with a tag resumes an
# incomplete release and never replaces assets; a manual run without one builds
# the dispatched ref.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to resume (empty builds the dispatched ref)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: romaine-life/pipeline-templates/actions/check-fetches@main
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo code=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE...HEAD")
          if grep -qvE '\.md$|^docs/|^LICENSE$' <<< "$files"; then
            echo code=true >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      GOPRIVATE: github.com/romaine-life/*
      GOSUMDB: 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      # A build that isn't resuming a release is named after the number release.yml
      # would give it; only release.yml releases.
      - name: Number the build
        id: version
        if: inputs.tag == ''
        uses: romaine-life/pipeline-templates/actions/release-version@main
        with:
          prefix: v0.1
          publish: 'false'

      - name: Read organization modules from Forgejo
        env:
          TOKEN: ${{ secrets.PIPELINE_DISPATCH_TOKEN }}
        run: |
          if (-not $env:TOKEN) { throw 'PIPELINE_DISPATCH_TOKEN is not set' }
          $auth = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:TOKEN"))
          Write-Host "::add-mask::$auth"
          'GIT_CONFIG_COUNT=2',
          'GIT_CONFIG_KEY_0=url.https://forgejo.romaine.life/romaine-life/.insteadOf',
          'GIT_CONFIG_VALUE_0=https://github.com/romaine-life/', # internet: Git rewrite source, not a fetch
          'GIT_CONFIG_KEY_1=http.https://forgejo.romaine.life/.extraheader',
          "GIT_CONFIG_VALUE_1=Authorization: Basic $auth" | Add-Content $env:GITHUB_ENV

      - uses: romaine-life/pipeline-templates/actions/setup-go@main
        with:
          go-version-file: go.mod

      - name: Vet and build WASM
        env:
          GOOS: js
          GOARCH: wasm
          CGO_ENABLED: '0'
          VERSION: ${{ inputs.tag || steps.version.outputs.version }}
        run: |
          $engine = go list -m -f '{{.Version}}' github.com/romaine-life/fzt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go vet .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go build -trimpath -ldflags "-X github.com/romaine-life/fzt/render.Version=$env:VERSION -X github.com/romaine-life/fzt-frontend.EngineVersion=$engine" -o fzt.wasm .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($file in 'fzt.wasm','fzt-terminal.js','fzt-terminal.css','fzt-web.js','fzt-dom-renderer.js') {
            if ((Get-Item $file).Length -eq 0) { throw "Empty release asset: $file" }
          }

      - name: Upload missing assets to existing release
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          $api = "$env:GITHUB_SERVER_URL/api/v1/repos/$env:GITHUB_REPOSITORY"
          $h = @{Authorization="token $env:TOKEN"}
          $sha = git rev-parse HEAD
          $tag = Invoke-RestMethod "$api/tags/$env:TAG" -Headers $h
          if ($tag.commit.sha -ne $sha) { throw 'Release tag points to another commit' }
          $release = Invoke-RestMethod "$api/releases/tags/$env:TAG" -Headers $h
          foreach ($file in 'fzt.wasm','fzt-terminal.js','fzt-terminal.css','fzt-web.js','fzt-dom-renderer.js') {
            $existing = $release.assets | Where-Object name -eq $file
            if ($existing) {
              $saved = Join-Path $env:RUNNER_TEMP ([Guid]::NewGuid().ToString())
              try {
                Invoke-WebRequest $existing.browser_download_url -Headers $h -OutFile $saved
                if ((Get-FileHash $saved).Hash -ne (Get-FileHash $file).Hash) { throw "Existing asset differs: $file" }
              } finally { Remove-Item $saved -ErrorAction SilentlyContinue }
            } else {
              Invoke-RestMethod -Method Post "$api/releases/$($release.id)/assets?name=$file" -Headers $h -Form @{attachment=Get-Item $file} | Out-Null
            }
          }
          if ($release.draft) {
            Invoke-RestMethod -Method Patch "$api/releases/$($release.id)" -Headers $h -ContentType application/json -Body '{"draft":false}' | Out-Null
          }
          Write-Host "Published all five assets for $env:TAG at $sha"
      - name: Delete the files of older releases
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        uses: romaine-life/pipeline-templates/actions/prune-releases@main
